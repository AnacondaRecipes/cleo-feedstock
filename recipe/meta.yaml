{% set version = "2.0.1" %}

package:
  name: cleo
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/c/cleo/cleo-{{ version }}.tar.gz
  sha256: eb4b2e1f3063c11085cebe489a6e9124163c226575a3c3be69b2e51af4a15ec5

build:
  number: 1
  skip: true  # [py<37]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - poetry-core 1.5
  run:
    - python
    - crashtest >=0.4.1,<0.5.0
    - rapidfuzz >=2.2.0,<3.0.0

test:
  imports:
    - cleo
    - cleo.commands
    - cleo.commands.completions
    - cleo.io
    - cleo.loaders
    - cleo.testers
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/sdispater/cleo
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Cleo allows you to create beautiful and testable command-line interfaces.
  description: Cleo allows you to create beautiful and testable command-line interfaces.
  dev_url: https://github.com/sdispater/cleo
  doc_url: https://cleo.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - nick-youngblut
    - johanneskoester
    - bgruening
    - daler
    - jdblischak
    - cbrueffer
    - ocefpaf
